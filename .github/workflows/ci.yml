name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo run lint typecheck test build

  e2e:
    name: Browser tests (login)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # API and worker
      NODE_ENV: test
      PORT: 4000
      WEB_ORIGIN: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/makemymarriage?directConnection=true
      LOGIN_CODE_SECRET: ci-only-login-code-secret-not-used-anywhere-else
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      # Web (NEXT_PUBLIC_* is built into the browser bundle)
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # MongoDB (replica set) and Mailpit, as on a developer machine.
      - run: pnpm infra:up

      - run: pnpm turbo run build

      - run: pnpm --filter @mmm/api migrate

      - run: pnpm --filter @mmm/web exec playwright install --with-deps chromium

      # Playwright starts the API, worker and web app from their builds (playwright.config.ts).
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
